    .ascii  { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 8px; fill: #22D3EE; letter-spacing: -0.2px; font-weight: bold; }
    .key    { font-family: 'Lexend', sans-serif; font-size: 15px; fill: #22D3EE; font-weight: 600; }
